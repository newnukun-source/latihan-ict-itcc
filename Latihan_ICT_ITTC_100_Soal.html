<title>Latihan ICT ITTC — 100 Soal</title>
<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at top,#152344 0,#0b1020 45%);color:var(--text);min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:26px}.brand p{margin:6px 0;color:var(--muted)}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.ghost{background:#202d48;color:#dfe8ff}.primary{background:var(--accent);color:#06101f}.danger{background:#4a2029;color:#ffdfe3}
.card{background:rgba(18,26,45,.94);border:1px solid #263556;border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.24)}
.progress{height:10px;background:#24314b;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#6ea8fe,#7ef0c3);transition:.25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:10px 0 20px}.q{font-size:21px;line-height:1.45;margin:8px 0 22px}.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--text);border:1px solid #2a3a5e;margin:10px 0;padding:14px 16px;border-radius:14px;font-size:15px;transition:.15s}.opt:hover{border-color:var(--accent);transform:translateY(-1px)}.opt.selected{border-color:var(--accent);background:#223a64}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.result{text-align:center}.score{font-size:58px;font-weight:900;margin:15px 0}.sub{color:var(--muted)}.review{margin-top:20px;text-align:left}.rev{padding:15px;border-radius:14px;margin:9px 0;background:#111a2c;border:1px solid #263556}.ok{border-left:4px solid var(--ok)}.bad{border-left:4px solid var(--bad)}.small{font-size:13px;color:var(--muted)}
.hidden{display:none}.pill{background:#202d48;color:#c8d6f7;padding:8px 10px;border-radius:999px;font-size:13px}
@media(max-width:640px){.wrap{padding:14px}.top{align-items:flex-start}.q{font-size:18px}.score{font-size:46px}}
</style>
</head>

  <div id="result" class="card result hidden"></div>

let quiz=[], idx=0, answers=[], finished=false;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function start(){
  // Acak urutan soal dan opsi jawaban setiap sesi.
  quiz=shuffle(BANK).map(q=>{
    const opts=q[1].map((text,i)=>({text,correct:i===q[2]}));
    return {q:q[0],opts:shuffle(opts)};
  });
  idx=0; answers=Array(quiz.length).fill(null); finished=false;
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('result').classList.add('hidden');
  render();
}
function render(){
  const item=quiz[idx];
  document.getElementById('num').textContent=`Soal ${idx+1} dari ${quiz.length}`;
  document.getElementById('question').textContent=item.q;
  const box=document.getElementById('options'); box.innerHTML='';
  item.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(answers[idx]===i?' selected':'');
    b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${escapeHtml(o.text)}`;
    b.onclick=()=>{answers[idx]=i; render();};
    box.appendChild(b);
  });
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('prev').style.opacity=idx===0?.45:1;
  document.getElementById('next').textContent=idx===quiz.length-1?'Selesai ✓':'Berikutnya →';
  document.getElementById('bar').style.width=((idx+1)/quiz.length*100)+'%';
  document.getElementById('scoreLive').textContent=`Terjawab: ${answers.filter(x=>x!==null).length}`;
}
function escapeHtml(s){
  return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};
document.getElementById('next').onclick=()=>{
  if(answers[idx]===null){
    alert('Pilih salah satu jawaban dulu 😭');
    return;
  }
  if(idx<quiz.length-1){idx++;render()} else showResult();
};
document.getElementById('restart').onclick=()=>{
  if(confirm('Acak ulang? Progres yang sekarang akan hilang.')) start();
};
function showResult(){
  let correct=0;
  const details=[];
  quiz.forEach((item,i)=>{
    const chosen=answers[i], right=item.opts.findIndex(x=>x.correct);
    if(chosen===right) correct++;
    details.push({i, chosen, right});
  });
  const pct=Math.round(correct/quiz.length*100);
  document.getElementById('quiz').classList.add('hidden');
  const res=document.getElementById('result');res.classList.remove('hidden');
  let html=`<h2>🎯 Hasil Latihan</h2><div class="score">${correct}/100</div>
  <div class="sub">${pct}% benar • ${100-correct} salah</div>
  <div style="margin:20px 0"><button class="primary" onclick="start()">🔀 Coba Lagi (acak ulang)</button></div>
  <div class="review"><h3>Review Jawaban</h3>`;
  details.forEach(d=>{
    const item=quiz[d.i], ok=d.chosen===d.right;
    const chosen=d.chosen===null?'Belum dijawab':String.fromCharCode(65+d.chosen)+'. '+item.opts[d.chosen].text;
    const right=String.fromCharCode(65+d.right)+'. '+item.opts[d.right].text;
    html+=`<div class="rev ${ok?'ok':'bad'}"><b>${d.i+1}. ${escapeHtml(item.q)}</b>
    <div class="small" style="margin-top:7px">Jawabanmu: ${escapeHtml(chosen)}</div>
    <div class="small">Kunci: ${escapeHtml(right)}</div></div>`;
  });
  html+='</div>';res.innerHTML=html;
}
start();
</script>
</body>
</html>
